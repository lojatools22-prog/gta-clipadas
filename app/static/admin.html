<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — GTA Clipadas</title><link rel="icon" href="/static/icon-64.png"><meta name="robots" content="noindex">
<style>
@font-face{font-family:Inter;src:url(/static/inter-400.woff2) format("woff2");font-weight:400}@font-face{font-family:Inter;src:url(/static/inter-600.woff2) format("woff2");font-weight:600}@font-face{font-family:Inter;src:url(/static/inter-800.woff2) format("woff2");font-weight:800}
:root{--bg:#09090b;--s1:#111114;--s2:#17171b;--s3:#1f1f25;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--pink:#ff1fa8;--mute:#a1a1aa;--dim:#71717a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:#fafafa;font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1200px;margin:auto;padding:20px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}header img{width:34px;height:34px;border-radius:50%}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em}header .sp{flex:1}
.m{color:var(--mute)}.d{color:var(--dim);font-size:12px}
.btn{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:600 13px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}.btn.g{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2)}.btn.g:hover{background:var(--s3)}.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.wa{background:#16a34a}
input,select,textarea{background:var(--s1);color:#fff;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:14px Inter,sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px}.k b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}.k span{color:var(--mute);font-size:12px}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.fu{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px}.fu b{font-size:20px;font-weight:800}.fu .bar{height:6px;background:var(--s3);border-radius:6px;margin-top:8px;overflow:hidden}.fu .bar i{display:block;height:100%;background:var(--pink)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.tabs button{background:none;border:0;color:var(--mute);border-radius:9px;padding:8px 14px;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--s3);color:#fff}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--s1);border:1px solid var(--line2);color:var(--mute);border-radius:999px;padding:6px 11px;font:600 12px Inter,sans-serif;cursor:pointer}.chip.on{background:#fff;color:#09090b;border-color:#fff}
.lead{display:grid;grid-template-columns:1.4fr 1fr 1fr 150px;gap:14px;align-items:start;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.lead b{font-size:15px}.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--s3);color:var(--mute);margin-left:6px}
.tag.hot{background:rgba(249,115,22,.15);color:#fb923c}.tag.auto{background:rgba(255,31,168,.15);color:#ff7ad1}.tag.pay{background:rgba(34,197,94,.15);color:#4ade80}
.lead textarea{width:100%;min-height:38px;resize:vertical;font-size:13px}
.st-novo{border-left:3px solid #71717a}.st-contatado{border-left:3px solid #3b82f6}.st-negociando{border-left:3px solid #eab308}.st-cliente{border-left:3px solid #22c55e}.st-perdido{border-left:3px solid #ef4444;opacity:.7}
table{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600}
.wrap{overflow-x:auto}
.login{max-width:360px;margin:12vh auto;background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:26px}
.login h2{margin:12px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}.login label{display:block;margin:12px 0 6px;font-weight:600;font-size:13px}.login input{width:100%;padding:12px;font-size:16px}
.login .btn{width:100%;justify-content:center;padding:13px;margin-top:16px;font-size:15px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#09090b;padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:9}
@media(max-width:820px){.lead{grid-template-columns:1fr}.funnel{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="login" id="login" hidden><a href="/" style="display:block;margin:0 0 10px;padding:12px;border-radius:12px;background:#ff1fa8;color:#fff;font-weight:800;text-align:center;text-decoration:none">Entrar com a minha conta do site</a><p style="font-size:13px;color:#aaa;margin:0 0 6px">Depois de entrar no site, volte para gta6clipadas.com/admin.</p>
  <img src="/static/icon-192.png" alt="" style="width:46px;height:46px;border-radius:50%">
  <h2>Painel GTA Clipadas</h2><p class="m" style="margin:0">Acesso restrito à equipe.</p>
  <form id="lf"><label>Usuário</label><input id="lu" autocomplete="username" required><label>Senha</label><input id="lp" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Entrar</button></form>
  <p class="d" id="lerr" style="margin:12px 0 0"></p>
</div>
<main id="app" hidden>
<header><img src="/static/icon-192.png" alt=""><h1>Painel</h1><span class="sp"></span><span class="d" id="who"></span><a class="btn g sm" href="/">Ver site</a><button class="btn g sm" onclick="sair()">Sair</button></header>
<div class="kpis" id="kpis"></div>
<div class="funnel" id="funnel"></div>
<div class="wrap" id="orig" style="margin:0 0 18px"></div>
<div class="tabs"><button data-t="crm" class="on">CRM de leads</button><button data-t="users">Usuários e planos</button><button data-t="pay">Pagamentos</button><button data-t="dest">Virais (TikTok)</button><button data-t="sup">Suporte</button><button data-t="err">Erros dos clientes</button></div>
<div id="tab"></div>
</main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let TOK=LS.get('cgta_admin')||LS.get('cgta_token');
const api=(p,o={})=>fetch(p,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+TOK,'Content-Type':'application/json'}}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.detail||'Erro');e.status=r.status;throw e}return j});
const brl=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');const dt=t=>t?new Date(t*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ago=t=>{if(!t)return'—';const s=Date.now()/1000-t;return s<3600?Math.round(s/60)+' min':s<86400?Math.round(s/3600)+' h':Math.round(s/86400)+' dias'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2500)}
const wa=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===11)d='55'+d;return d?'https://wa.me/'+d:''};
const ST={novo:'Novo',contatado:'Contatado',negociando:'Negociando',cliente:'Cliente',perdido:'Perdido'};
let LEADS=[],F={stage:'',q:'',tipo:''};

let PER=(()=>{try{return localStorage.getItem('adm_per')||'7d'}catch(e){return '7d'}})(),OV=null;
const PNAME={'24h':'24 horas','7d':'7 dias','30d':'30 dias','total':'Total'};
function setPer(p){PER=p;try{localStorage.setItem('adm_per',p)}catch(e){}drawKpis();funnel()}
async function kpis(){OV=await api('/api/admin/overview');drawKpis()}
function drawKpis(){const d=OV;if(!d)return;const P=(d.periodos||{})[PER]||{},sfx=PER==='total'?' (total)':` (${PNAME[PER]})`;
  const L=[[P.visitas,'Visitas'+sfx],[P.cadastros,'Cadastros'+sfx],[P.cortes,'Cortes'+sfx],[P.checkouts,'Foram pro pagamento'+sfx],[P.vendas,'Vendas'+sfx],[brl(P.receita||0),'Receita'+sfx],
    [P.visitas?(Math.round(P.cadastros/P.visitas*1000)/10).toString().replace('.',',')+'%':'—','Visita → cadastro'],[d.assinantes_ativos,'Assinantes ativos agora'],[d.fila_agora,'Na fila agora']];
  $('#kpis').innerHTML=`<div style="grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap">${Object.keys(PNAME).map(k=>`<button class="btn sm${k===PER?' on':''}" style="${k===PER?'background:#ff1fa8;border-color:#ff1fa8;color:#fff':''}" onclick="setPer('${k}')">${PNAME[k]}</button>`).join('')}</div>`+
    L.map(([v,n])=>`<div class="k"><b>${v??0}</b><span>${n}</span></div>`).join('')}
function funnel(){const lim=PER==='total'?0:Date.now()/1000-({'24h':1,'7d':7,'30d':30}[PER]||7)*86400;const u=LEADS.filter(l=>l.tipo==='cadastro'&&(l.created||0)>=lim),a=u.length,b=u.filter(l=>l.cortes>0).length,c=u.filter(l=>l.cortes>=3).length,p=u.filter(l=>l.pago>0).length;
  const F2=[['Cadastraram',a],['Fizeram 1 corte',b],['Usaram os grátis',c],['Pagaram',p]];
  $('#funnel').innerHTML=F2.map(([n,v])=>`<div class="fu"><span class="m" style="font-size:12px">${n}</span><br><b>${v}</b> <span class="d">${a?Math.round(v/a*100):0}%</span><div class="bar"><i style="width:${a?v/a*100:0}%"></i></div></div>`).join('')}

async function origens(){try{const d=await api('/api/admin/origens?days=7');$('#orig').innerHTML=`<table><tr><th>De onde vieram (7 dias)</th><th>Visitas</th><th>Cadastros</th><th>Conversão</th><th>Pagaram</th></tr>${d.map(o=>`<tr><td>${esc(o.origem)}</td><td>${o.visitas}</td><td>${o.cadastros}</td><td>${o.visitas?Math.round(o.cadastros/o.visitas*100)+'%':'—'}</td><td>${o.pagaram}</td></tr>`).join('')||'<tr><td colspan=5 class="m">Ainda sem visitas registradas.</td></tr>'}</table>`}catch(e){}}
async function erros(){const d=await api('/api/admin/erros?horas=72');
  $('#tab').innerHTML=`<p class="m" style="margin:0 0 12px">Tudo que deu errado na tela dos clientes nas últimas 72 h (avisos, erros de corte e da IA). ${d.length} registros.</p><div class="wrap"><table><tr><th>Quando</th><th>Quem</th><th>Tipo</th><th>O que apareceu pra pessoa</th></tr>${d.map(e=>`<tr><td>${new Date(e.at*1000).toLocaleString('pt-BR')}</td><td>${esc(e.name||e.email||'visitante')}</td><td>${esc(e.kind)}</td><td>${esc(e.msg)}</td></tr>`).join('')||'<tr><td colspan=4 class="m">Nenhum erro registrado.</td></tr>'}</table></div>`}
async function sup(){const d=await api('/api/admin/suporte');const pend=d.filter(t=>!t.reply).length;
  $('#tab').innerHTML=`<p class="m" style="margin:0 0 12px">${pend} sem resposta · ${d.length} no total. A resposta aparece pro cliente em Conta → Suporte no site.</p>`+(d.map(t=>`<div class="lead" style="border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px">
   <b>${esc(t.name||t.email||'Visitante')}</b> <span class="m">${esc(t.email||'')} · ${new Date(t.created*1000).toLocaleString('pt-BR')}${t.plan?' · '+esc(t.plan):''}</span>
   <p style="white-space:pre-wrap;margin:8px 0">${esc(t.msg)}</p>
   ${t.reply?`<div style="background:var(--s2);border-radius:10px;padding:10px"><span class="m">Sua resposta:</span><p style="white-space:pre-wrap;margin:4px 0 0">${esc(t.reply)}</p></div>`:''}
   <textarea id="r${t.id}" rows="3" style="width:100%;margin-top:8px" placeholder="${t.reply?'Responder de novo':'Escreva a resposta'}"></textarea>
   <button class="btn sm" style="margin-top:6px" onclick="responder(${t.id})">Enviar resposta</button></div>`).join('')||'<p class="m">Nenhuma mensagem ainda.</p>')}
async function responder(id){const v=$('#r'+id).value.trim();if(!v)return;try{await api('/api/admin/suporte/'+id+'/responder',{method:'POST',body:JSON.stringify({reply:v})});sup()}catch(e){alert(e.message)}}
async function crm(){origens();const d=await api('/api/admin/crm');LEADS=d.leads;funnel();drawCrm()}
function drawCrm(){const cnt=s=>LEADS.filter(l=>l.stage===s).length;
  let L=LEADS.filter(l=>(!F.stage||l.stage===F.stage)&&(!F.tipo||(F.tipo==='quente'?l.quente:F.tipo==='auto'?l.tipo==='automatico':F.tipo==='pagou'?l.pago>0:true))&&(!F.q||[l.name,l.email,l.phone,l.handle,l.origem].join(' ').toLowerCase().includes(F.q.toLowerCase())));
  $('#tab').innerHTML=`<div class="bar2"><input id="q" placeholder="Buscar nome, e-mail, celular ou @" value="${esc(F.q)}" style="flex:1;min-width:220px">
    <button class="btn g sm" onclick="csv()">⬇ Exportar planilha</button></div>
  <div class="bar2"><div class="chips">${[['','Todas',LEADS.length],...Object.keys(ST).map(s=>[s,ST[s],cnt(s)])].map(([k,n,c])=>`<button class="chip ${F.stage===k?'on':''}" data-st="${k}">${n} · ${c}</button>`).join('')}</div>
  <div class="chips">${[['','Todos'],['quente','🔥 Quentes'],['auto','Interessados no Automático'],['pagou','Pagaram']].map(([k,n])=>`<button class="chip ${F.tipo===k?'on':''}" data-tp="${k}">${n}</button>`).join('')}</div></div>
  <p class="d" style="margin:0 0 10px">${L.length} leads · 🔥 quente = plano grátis, já fez 2+ cortes nos últimos 14 dias (bom pra oferecer plano)</p>
  ${L.map(l=>`<div class="lead st-${l.stage}"><div><b>${esc(l.name||'—')}</b>${l.quente?'<span class="tag hot">🔥 quente</span>':''}${l.tipo==='automatico'?'<span class="tag auto">Automático</span>':''}${l.pago>0?'<span class="tag pay">'+brl(l.pago)+'</span>':''}${l.origem&&l.origem!=='direto'?'<span class="tag">via '+esc(l.origem)+'</span>':''}
      <div class="m" style="margin-top:4px">${esc(l.email||l.handle||'')}</div><div class="m">${esc(l.phone||'')}</div><div class="d">Cadastro há ${ago(l.created)}</div></div>
    <div><span class="d">Plano</span><div>${esc(l.plan_name||'—')}${l.plan_until?'<span class="d"> até '+dt(l.plan_until).slice(0,8)+'</span>':''}</div>
      <span class="d">Cortes</span><div>${l.cortes||0}${l.ultimo_corte?'<span class="d"> · último há '+ago(l.ultimo_corte)+'</span>':''}${l.left!=null&&l.tipo==='cadastro'?'<span class="d"> · restam '+l.left+'</span>':''}</div></div>
    <div><textarea data-n="${esc(l.key)}" placeholder="Anotações">${esc(l.notes)}</textarea></div>
    <div style="display:grid;gap:6px"><select data-s="${esc(l.key)}">${Object.keys(ST).map(s=>`<option value="${s}" ${l.stage===s?'selected':''}>${ST[s]}</option>`).join('')}</select>
      ${wa(l.phone)?`<a class="btn wa sm" target="_blank" rel="noopener" href="${wa(l.phone)}?text=${encodeURIComponent('Fala '+(l.name||'').split(' ')[0]+'! Aqui é do GTA Clipadas 👋')}">WhatsApp</a>`:''}
      ${l.email?`<a class="btn g sm" href="mailto:${esc(l.email)}">E-mail</a>`:''}</div></div>`).join('')||'<p class="m">Nenhum lead com esse filtro.</p>'}`;
  $('#q').oninput=e=>{F.q=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{drawCrm();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{F.stage=b.dataset.st;drawCrm()});
  document.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{F.tipo=b.dataset.tp;drawCrm()});
  document.querySelectorAll('[data-s]').forEach(s=>s.onchange=async()=>{await api('/api/admin/crm',{method:'POST',body:JSON.stringify({key:s.dataset.s,stage:s.value})});LEADS.find(l=>l.key===s.dataset.s).stage=s.value;toast('Etapa salva');drawCrm()});
  document.querySelectorAll('[data-n]').forEach(t=>t.onchange=async()=>{await api('/api/admin/crm',{method:'POST',body:JSON.stringify({key:t.dataset.n,notes:t.value})});LEADS.find(l=>l.key===t.dataset.n).notes=t.value;toast('Anotação salva')})}
function csv(){const H=['nome','email','celular','instagram','tipo','plano','cortes','pago','etapa','anotacoes','cadastro'];
  const rows=LEADS.map(l=>[l.name,l.email,l.phone,l.handle,l.tipo,l.plan_name,l.cortes,l.pago,ST[l.stage],l.notes,dt(l.created)].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';'));
  const b=new Blob(['﻿'+H.join(';')+'\n'+rows.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='leads-gtaclipadas.csv';a.click()}

const PL=['iniciante','clipador','pro','passe'];
async function users(q=''){const d=await api('/api/admin/users?q='+encodeURIComponent(q));
  $('#tab').innerHTML=`<div class="bar2"><input id="q" placeholder="Buscar por nome, e-mail ou celular" value="${esc(q)}" style="flex:1;min-width:220px"></div><div class="wrap"><table><tr><th>Nome</th><th>Contato</th><th>Plano</th><th>Restam</th><th>Cortes</th><th>Criado</th><th>Ações</th></tr>
  ${d.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}<br><span class="m">${esc(u.phone_full)}</span></td><td>${esc(u.plan_name)}${u.plan_until?'<br><span class="d">até '+dt(u.plan_until)+'</span>':''}</td><td>${u.left}</td><td>${u.cortes}</td><td>${dt(u.created)}</td>
  <td><select data-u="${u.id}" class="pl"><option value="">Dar plano…</option>${PL.map(p=>`<option value="${p}">${p}</option>`).join('')}</select> <button class="btn sm" data-c="${u.id}">+5 cortes</button></td></tr>`).join('')}</table></div>`;
  $('#q').onchange=e=>users(e.target.value);
  document.querySelectorAll('.pl').forEach(s=>s.onchange=async()=>{if(!s.value)return;if(!confirm(`Liberar o plano ${s.value} pra este usuário?`))return(s.value='');await api('/api/admin/plan',{method:'POST',body:JSON.stringify({user_id:+s.dataset.u,plan:s.value})});toast('Plano liberado');users(q);kpis()});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{await api('/api/admin/credits',{method:'POST',body:JSON.stringify({user_id:+b.dataset.c,amount:5})});toast('+5 cortes');users(q)})}
async function dest(){const d=await api('/api/admin/destaques');$('#tab').innerHTML=`<div class="wrap" style="padding:16px"><p class="m">Links do TikTok que aparecem no topo da aba Virais, um por linha, na ordem.</p><textarea id="dl" style="width:100%;min-height:220px;background:#0f0a16;color:#fff;border:1px solid #333;border-radius:10px;padding:10px;font:14px monospace">${esc(d.urls.join('\n'))}</textarea><button class="btn" style="margin-top:10px" onclick="saveDest()">Salvar</button></div>`}
async function saveDest(){try{await api('/api/admin/destaques',{method:'POST',body:JSON.stringify({urls:$('#dl').value.split('\n')})});toast('Salvo! Já aparece na aba Virais.')}catch(e){toast(e.message)}}
async function pays(){const d=await api('/api/admin/payments');$('#tab').innerHTML=`<div class="wrap"><table><tr><th>Data</th><th>Usuário</th><th>Plano</th><th>Valor</th><th>Situação</th></tr>${d.map(p=>`<tr><td>${dt(p.created)}</td><td>${esc(p.email)}</td><td>${esc(p.plan)}</td><td>${brl(p.amount)}</td><td>${esc(p.status)}</td></tr>`).join('')||'<tr><td colspan=5 class="m">Nenhum pagamento ainda.</td></tr>'}</table></div>`}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));({crm,users,pay:pays,dest,sup,err:erros})[b.dataset.t]()});
function sair(){LS.set('cgta_admin',null);location.reload()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('#lu').value,password:$('#lp').value})});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Erro');LS.set('cgta_admin',j.token);TOK=j.token;start(j.user)}catch(err){$('#lerr').textContent=err.message}};
